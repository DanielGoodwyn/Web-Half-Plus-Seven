<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <title>Half Plus Seven</title>
  <meta name="description" content="Half Plus Seven">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/js/bootstrap.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <nav class="navbar navbar-default navbar-fixed-top glass">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#half-plus-seven-navbar-collapse">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>        
        <a class="navbar-brand" onclick="window.location.href='index.html';">
          <span>
            <img src="images/half-plus-seven.png" style="border-radius:1in;">
          </span>
          <span class="hidden-xs">
            Half Plus Seven
          </span>
        </a>
      </div>
      <div class="collapse navbar-collapse" id="half-plus-seven-navbar-collapse">
        <ul class="nav navbar-nav navbar-right">
          <li>
            <a href="about.html"><i class="glyphicon glyphicon-info-sign"></i> about</a>
          </li>
          <li class="dropdown">
            <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-expanded="false">
              <span id="userProfilePicture"></span>
              <span id="usernameDiv">log in to begin.</span>
              <span class="caret"></span>
            </a>
            <ul class="dropdown-menu" role="menu">
              <li><a onclick="window.location.href='index.html';"><i class="glyphicon glyphicon-hourglass"></i> Half Plus Seven</a></li>
              <li class="divider"></li>
              <li><a onclick="logout()"><i class="glyphicon glyphicon-log-out"></i> Log out</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="panel panel-default login-panel">
          <div class="panel-heading">
            <h3 class="panel-title"> <i class="float-left glyphicon glyphicon-user"></i> Login</h3>
          </div>
          <div class="panel-body">
            <div class="row">
              <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                <div id="googleAuthSection" style="margin-bottom: 20px; text-align: center;">
                  <button class="btn btn-default google-btn" id="googleSignInBtn" type="button" onclick="authenticateGoogle()">
                    <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align: middle;">
                      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                      <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.347 2.827.957 4.039l3.007-2.332z"/>
                      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
                    </svg>
                    <span>begin with Google</span>
                  </button>
                  <div class="or-divider">
                    <span class="or-line"></span>
                    <span class="or-text">or</span>
                    <span class="or-line"></span>
                  </div>
                </div>
                <input type="email" id="emailInput" placeholder="email" onkeypress="return authenticate(event)">
                <input type="password" id="passwordInput" placeholder="password" onkeypress="return authenticate(event)">
              </div>
              <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12" style="margin-top: 15px;">
                <button class="btn btn-primary" id="loginBtn" onclick="authenticate('click')">begin</button>
                <div style="margin-top: 15px;">
                  <a href="#" onclick="forgotPassword(); return false;">Forgot password?</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="content-panel" style="display:none;">
      <div class="panel-heading">
	<h3 class="panel-title"> <i class="float-left glyphicon glyphicon-user"></i> Profile</h3>
      </div>
      <div id="profile"></div>
    </div>
    <div style='clear:both;'><br></div>
    <div class="panel panel-default content-panel" style="display:none;">
      <div class="panel-heading">
	<h3 class="panel-title"> <i class="float-left glyphicon glyphicon-heart"></i> New Person</h3>
      </div>
      <div class="profile-panel">
        <ul>
          <li>
            <span class='quarter'>
              <input id='nameInput' placeholder='Name' type='text'>
            </span>
            <span class='quarter'>
              <input id='ageInput' placeholder='Age' type='number'>
            </span>
            <span class='quarter'>
              <input id='dobInput' placeholder='Birthday' min='14' max='200' type='date'>
            </span>
            <span class='quarter'>
              <span class='half'><b>Range</b><br><div id="range">-</div></span>
              <span class='half' style="display:flex; align-items:center; justify-content:center;">
                <button class='addPerson btn btn-primary' style='width:40px!important;height:40px!important;border-radius:50%!important;padding:0!important;margin:0!important;display:flex;align-items:center;justify-content:center;'>
                  <i class='glyphicon glyphicon-plus'></i>
                </button>
              </span>
            </span>
          </li>
        </ul>
        <div style='clear:both;'></div>
      </div>
      <div id="list"></div>
    </div>
  </div>
  <script src="js/half-plus-seven.js?v=5"></script>
</body>
</html>
